version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: oxygen-postgres
    environment:
      POSTGRES_DB: oxygen
      POSTGRES_USER: oxygen
      POSTGRES_PASSWORD: oxygen
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./resources/db.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./resources/init-data.sql:/docker-entrypoint-initdb.d/02-data.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U oxygen -d oxygen" ]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: oxygen-redis
    command: redis-server --requirepass oxygen
    environment:
      REDIS_PASSWORD: oxygen
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  redis_data:
